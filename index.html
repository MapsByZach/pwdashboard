Copy and paste this into a file such as prowork-skills-dashboard.html:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProWork Skill Library</title>
<style>
:root{--bg:#07111d;--panel:#0d1b2a;--panel2:#10243a;--line:#213a53;--text:#ecf5ff;--muted:#8fa8bf;--brand:#36d1c4;--blue:#55a7ff;--gold:#ffcb6b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0,#12304a 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
button,input,select{font:inherit}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:#091522;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:20px;font-weight:800}.brand b{color:var(--brand)}
.muted{color:var(--muted);font-size:12px}
.total{background:linear-gradient(135deg,#10283d,#0d1b2a);border:1px solid var(--line);border-radius:14px;padding:16px;margin:22px 0}
.total strong{display:block;font-size:32px;color:var(--brand)}
nav button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
nav button:hover,nav button.active{background:#16304a;color:#fff}
main{padding:28px;min-width:0}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}
h1{font-size:30px;margin:0 0 5px}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) 170px auto;gap:10px;margin-bottom:16px}
input,select,.toggle{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 13px}
.toggle{cursor:pointer}.toggle.on{border-color:var(--gold);color:var(--gold)}
.summary{display:flex;gap:8px;margin:12px 0 18px;color:var(--muted)}
.pill{border:1px solid var(--line);background:#0c1b29;border-radius:99px;padding:5px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:16px;min-height:130px;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:#3e6f98;box-shadow:0 10px 25px #0005}
.card h3{font-size:15px;margin:10px 28px 7px 0;overflow-wrap:anywhere}
.tag{display:inline-block;color:#8bd7ff;background:#12304b;border:1px solid #22547b;padding:3px 7px;border-radius:99px;font-size:11px}
.star{position:absolute;right:11px;top:10px;border:0;background:none;color:#577087;font-size:19px;cursor:pointer}
.star.on{color:var(--gold)}
.empty{grid-column:1/-1;padding:70px 15px;text-align:center;color:var(--muted)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,92vw);background:#0b1826;border-left:1px solid var(--line);box-shadow:-20px 0 60px #0009;padding:26px;transform:translateX(105%);transition:.22s;z-index:10;overflow:auto}
.drawer.open{transform:none}
.close{float:right;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
.drawer h2{clear:both;padding-top:24px;overflow-wrap:anywhere}
.path{background:#07111d;border:1px solid var(--line);border-radius:8px;padding:10px;color:#9dc3e5;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{border:1px solid #3476a6;background:#12304b;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}
@media(max-width:800px){.shell{display:block}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}nav button{min-width:max-content}main{padding:18px}.controls{grid-template-columns:1fr 120px}.toggle{grid-column:1/-1}}
</style>
</head>

const categoryRules=[
  ["Knowledge Graph",/knowledge|entity|entities|relationship|link-chart|\bkg\b|dico/],
  ["Imagery & Raster",/raster|imagery|image-server|mosaic|spectral|pixel|sar-|stac|rio-|multiband|multibase/],
  ["ArcGIS Pro & ArcPy",/arcpy|arcgis-pro|pro-|toolbox|feature-class|annotation/],
  ["Web Apps & UI",/webapp|experience|\bexb\b|widget|calcite|browser|javascript|js-sdk|storymap|dashboard/],
  ["Data Engineering",/pipeline|etl|sedona|gdal|geojson|csv|json|bigquery|data-/],
  ["Analysis & Geometry",/buffer|viewshed|analysis|geometry|cluster|hotspot|route|surface|center|select|project|reproject|zonal|aggregate|dissolve|extract/],
  ["AI & Computer Vision",/ai-|deep-learning|computer-vision|detect|embedding|dinov2|sam-|aircraft|road-extraction/],
  ["Enterprise & Auth",/enterprise|portal|auth|token|publishing|publish|server|service/],
  ["Maps & Visualization",/map|basemap|symbology|style|layer|display|3d|scene|cartograph|visual/],
  ["Automation & Utilities",/.*/]
];

const category=name=>categoryRules.find(rule=>rule[1].test(name))[0];
const pretty=name=>name.split("-").map(word=>{
  const acronyms=["3d","ai","api","cli","csv","etl","gdal","gis","json","kg","rf","sar","sdk","svg","tms","ui","url"];
  return acronyms.includes(word)?word.toUpperCase():word[0].toUpperCase()+word.slice(1);
}).join(" ");

let active="All";
let favoritesOnly=false;
let favorites=new Set(JSON.parse(localStorage.getItem("skill-favorites")||"[]"));

const counts={};
skills.forEach(name=>{
  const group=category(name);
  counts[group]=(counts[group]||0)+1;
});

const nav=document.querySelector("#nav");
const grid=document.querySelector("#grid");
const search=document.querySelector("#search");
const sort=document.querySelector("#sort");
const drawer=document.querySelector("#drawer");

document.querySelector("#total").textContent=skills.length;
search.placeholder=`Search ${skills.length} skills…`;

[["All",skills.length],...Object.entries(counts).sort((a,b)=>b[1]-a[1])]
.forEach(([name,count])=>{
  const button=document.createElement("button");
  button.dataset.category=name;
  button.innerHTML=`<span>${name}</span><span>${count}</span>`;
  button.onclick=()=>{
    active=name;
    document.querySelectorAll("nav button").forEach(item=>{
      item.classList.toggle("active",item.dataset.category===name);
    });
    render();
  };
  nav.append(button);
});

nav.firstElementChild.classList.add("active");

function saveFavorites(){
  localStorage.setItem("skill-favorites",JSON.stringify([...favorites]));
}

function toggleFavorite(name,event){
  event?.stopPropagation();
  favorites.has(name)?favorites.delete(name):favorites.add(name);
  saveFavorites();
  render();
}

function openSkill(name){
  const group=category(name);
  const path=`agent-skills/${name}/SKILL.md`;

  document.querySelector("#details").innerHTML=`
    <span class="tag">${group}</span>
    <h2>${pretty(name)}</h2>
    <p class="muted">Installed skill identifier</p>
    <div class="path">${name}</div>

    <h3>Capability</h3>
    <p>Workflow guidance for ${pretty(name).toLowerCase()}.</p>

    <h3>Relative location</h3>
    <div class="path">${path}</div>

    <div class="actions">
      <button id="copyName">Copy skill name</button>
      <button id="detailFavorite">
        ${favorites.has(name)?"★ Remove favorite":"☆ Add favorite"}
      </button>
    </div>
  `;

  document.querySelector("#copyName").onclick=async event=>{
    await navigator.clipboard.writeText(name);
    event.currentTarget.textContent="Copied";
  };

  document.querySelector("#detailFavorite").onclick=event=>{
    toggleFavorite(name,event);
    openSkill(name);
  };

  drawer.classList.add("open");
}

function render(){
  const query=search.value.toLowerCase().trim();
  const order=sort.value;

  let visible=skills.filter(name=>{
    const matchesCategory=active==="All"||category(name)===active;
    const matchesSearch=!query||
      name.includes(query)||
      pretty(name).toLowerCase().includes(query);
    const matchesFavorites=!favoritesOnly||favorites.has(name);
    return matchesCategory&&matchesSearch&&matchesFavorites;
  });

  visible.sort((a,b)=>{
    if(order==="za") return b.localeCompare(a);
    if(order==="category"){
      return (category(a)+a).localeCompare(category(b)+b);
    }
    return a.localeCompare(b);
  });

  document.querySelector("#shown").textContent=`${visible.length} shown`;
  document.querySelector("#activeCategory").textContent=
    active==="All"?"All categories":active;

  grid.innerHTML="";

  if(!visible.length){
    grid.innerHTML='<div class="empty">No skills match these filters.</div>';
    return;
  }

  visible.forEach(name=>{
    const card=document.createElement("article");
    card.className="card";
    card.onclick=()=>openSkill(name);
    card.innerHTML=`
      <button class="star ${favorites.has(name)?"on":""}" 
              aria-label="Toggle favorite">★</button>
      <span class="tag">${category(name)}</span>
      <h3>${pretty(name)}</h3>
      <div class="muted">
        Workflow guidance for ${pretty(name).toLowerCase()}.
      </div>
    `;
    card.querySelector(".star").onclick=event=>toggleFavorite(name,event);
    grid.append(card);
  });
}

search.oninput=render;
sort.onchange=render;

document.querySelector("#favoritesOnly").onclick=event=>{
  favoritesOnly=!favoritesOnly;
  event.currentTarget.classList.toggle("on",favoritesOnly);
  event.currentTarget.textContent=
    favoritesOnly?"★ Favorites only":"☆ Favorites only";
  render();
};

document.querySelector("#closeDrawer").onclick=()=>{
  drawer.classList.remove("open");
};

document.addEventListener("keydown",event=>{
  if(event.key==="Escape") drawer.classList.remove("open");
  if(event.key==="/"&&document.activeElement.tagName!=="INPUT"){
    event.preventDefault();
    search.focus();
  }
});

window.__app={skills,category,render};
render();
</script>
